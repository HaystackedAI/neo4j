[project]
name = "neo4jj"
version = "0.1.0"
description = "Working through Graph Data Science with Python and Neo4j"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.2.0",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphbook"]
