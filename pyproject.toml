[project]
name = "neo4jj"
version = "0.1.0"
description = "Working through Graph Data Science with Python and Neo4j"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.56",
    "neo4j>=6.2.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphbook"]
